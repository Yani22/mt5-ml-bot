# config.yaml
# Values here are what the bot and backtester run with. Tuner (tuner.py) results are NOT written here:
# they go to optuna_params/<symbol>_best_params.pkl and override `models.defaults` / `features` at load time.

# --- General Settings ---
use_gpu: false # Master switch to enable GPU acceleration for supported models (lgbm, xgb)
magic_number: 424242 # Unique ID for this bot's trades
data_source: mt5 # "mt5" or "csv". Automatically switches to csv on non-windows

# --- Optuna Tuning Specifics ---
optuna_n_trials: 150
optuna_pruning_interval: 100 # Interval for Optuna pruning checks
n_jobs: -1 # Number of parallel jobs for tuning. -1 means all available CPU cores.
roc_lags_options:
- [1, 3, 5, 10]
- [1, 2, 4, 8]
- [2, 5, 10, 15]
- [1, 2, 3]

# --- Backtesting Settings ---
backtesting:
  initial_equity: 130.00
  enable_retraining: False # Whether backtester.py retrains during the run

# --- ML & CV Settings ---
cv_samples_per_split: 1000 # Affects number of splits in TimeSeriesSplit. Higher -> fewer splits -> faster but less robust CV.

# --- Fetch / Data Management ---
fetch:
  initial_fetch_bars: 45000        # how many bars to bootstrap at startup / initial fetch
  save_raw_data_locally: true      # store raw CSV/feather parquet locally for caching
  raw_data_dir: "data/historical_data" # where to store cached data
  retrain_in_background: false      # whether retrain runs async
  retrain_time_utc: "23:55"           # scheduled daily retrain (UTC); null = disabled
force_retrain_on_startup: false    # unused: nothing reads it (the start-up summary warns if it is true). Models retrain at fetch.retrain_time_utc; run trainer.py to retrain now.

# --- Ensemble Training Control ---
ensemble_training:
  min_samples_for_ensemble: 1000   # don't fit ensemble if fewer samples available

# --- Symbols & timeframe ---
# CSV data needed per symbol: M5-<SYMBOL>, H1-<SYMBOL>, and M5-USDX-DEC25 if inter_market is enabled
symbols: ["USDJPY#"]
timeframe: "M5"            # One of: M1, M5, M15, M30, H1, H4
history_bars: 45000
retrain_every_bars: 10000     # ~3.5 days at M5
prediction_horizon: 12       # bars ahead for the label (12 bars = 1 hour on M5)
retraining_window_bars: 45000         # Number of recent bars for rolling window retraining. null for expanding window.

# --- Features ---
# Search ranges for tuner.py: [low, high] (or [low, high, log]). The FIRST value is what a run with no tuned-params file uses
# (e.g. ema_slow 200), so the bot builds its features from it until a tuned file overrides single keys.
features:
  rsi_period: [14, 14]
  ema_slow: [200, 200]

# --- Context Features (static, not tuned by optuna) ---
context_features:
  mta:
    enabled: true
    timeframe: "H1"
    ema_period: 50
    rsi_period: 14
  inter_market:
    enabled: false
    symbol: "USDX-DEC25" # Make sure this symbol is available in your data source
    roc_lags: [5, 21, 63]
  price_action:
    enabled: true
    home_base_ma_period: 200
    swing_lookback: 50

# --- Base learners ---
# defaults: single values used when a symbol has no tuned params (optuna_params/<symbol>_best_params.pkl).
# tune:     [min, max] (or [min, max, "log"]) search ranges, used ONLY by tuner.py.
models:
- name: lgbm
  defaults:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: -1
    colsample_bytree: 0.8
  tune:
    n_estimators: [100, 500]
    learning_rate: [0.01, 0.1, "log"]
    max_depth: [3, 10]
    colsample_bytree: [0.6, 1.0]

ensemble:
  method: soft_vote
  threshold_metric: sharpe_ratio # sharpe_ratio | custom_pnl
  threshold_grid: auto # "auto" or an explicit list, e.g. [0.5, 0.52, 0.55, 0.6]
  min_ensemble_auc: 0.55        # Minimum AUC required to allow trading
  auto_threshold: true           # Auto-adjust thresholds based on historical PnL

# --- Trading costs & execution ---
trading_costs:
  source: static
  defaults:
    slippage_pips: 0.1
    commission_per_trade: 0.0
    adaptive_slippage: true        # only multiplies slippage_pips by adaptive_slippage_multiplier; it does NOT read the spread
    retry_order_send: 3            # number of retries for failed order sends
    adaptive_slippage_multiplier: 1.0

# --- Thompson Sampling Configuration ---
thompson_sampling:
  enabled: true
  atr_grid: [1.0, 1.5, 2.0, 2.5] # ATR multiplier - provides options for the stop-loss distance
  min_prob_grid_long: [0.53, 0.55, 0.57, 0.60, 0.63]
  min_prob_grid_short: [0.53, 0.55, 0.57, 0.60, 0.63]
  prior_mean: 0.0
  prior_var: 1.0
  obs_var: 1.0
  decay: 0.995 # Forgetting factor for non-stationarity
  reward_normalization_factor: 1000.0 # Divide PnL by this to normalize reward
  rule_rolling_window: 100 # Bars for rolling volatility/returns
  vol_threshold: 0.0005 # ATR as a fraction of price (0.0005 = 0.05%); stops shrink once ATR/price exceeds twice this
  dd_cut_multiplier: 2.0 # Multiplier for max_drawdown in scaling
  consec_loss_cut: 0.2 # Multiplier for consecutive losses in scaling
  contextual_enabled: true           # Toggle contextual bandit
  context_dim: 9                      # ignored: fixed by the code (9 inputs)
  min_visits_for_exploration: 5        # number of visits before arm is considered "known"
  exploration_risk_mult: 0.5         # fraction of normal risk to use for exploratory arms
  warmstart_weight: 0.0              # weight for warmstart merging (0 = off; 1.0 = fully add backtest priors)
  state_file: "results/ts_risk_controller_state.json" # File to save RiskController state

  # Adaptive Grid Configuration (for Dynamic Grid Adaptation)
  adaptive_grids_enabled: false
  adaptation_interval_updates: 500   # Number of updates to an arm before considering adaptation
  adaptation_refinement_factor: 0.3  # How much to narrow the search space (e.g., 0.3 means 30% of current interval)
  min_grid_size: 5                   # Minimum number of arms in a grid
  max_grid_size: 20                  # Maximum number of arms in a grid

  # Bandit Reset Configuration
  bandit_reset_enabled: true
  reset_on_drawdown_percent: 0.20    # Reset if equity drops X% from peak
  reset_on_consecutive_losses: 10    # Reset if X consecutive losing trades
  reset_on_low_ensemble_auc: 0.52    # Reset if ensemble AUC drops below this
  reset_cooldown_hours: 24.0         # Cooldown period after a reset (in hours)

# --- Risk management ---
risk:
  risk_per_trade: 0.01
  dynamic_risk:
    enabled: true
    base_risk: 0.01       # Fraction of equity risked at auc_floor
    max_risk: 0.01        # Fraction of equity risked at auc_ceiling
    auc_floor: 0.55       # The AUC score that corresponds to base_risk
    auc_ceiling: 0.65     # The AUC score that corresponds to max_risk

  dynamic_tp:
    enabled: false        # never applied: the take-profit is always the stop multiple x atr_multiplier_tp / atr_multiplier_sl
    base_tp_mult: 2.0     # For low-confidence trades, aim for a 2x ATR take-profit
    max_tp_mult: 4.0      # For high-confidence trades, give them more room to run with a 4x ATR take-profit
    auc_floor: 0.55       # Same AUC floor as risk
    auc_ceiling: 0.65     # Same AUC ceiling as risk

  max_positions: 3            # Max concurrent positions (live uses 3; earlier backtests used 1)
  max_portfolio_risk: 0.03    # Total equity risk cap
  atr_multiplier_sl: 1.0
  atr_multiplier_tp: 2.0
  breakeven_at_1R: true
  trailing_atr_mult: 1.0
  min_prob_long: 0.55         # 0.51-0.55 = low confidence, 0.56-0.65 = high
  min_prob_short: 0.55        # 0.51-0.55 = low confidence, 0.56-0.65 = high
  block_on_drawdown: 0.2      # pause if drawdown from equity peak exceeds this fraction; 1.0 = disabled
  min_auc_improvement: 0.0025 # unused since fix 65 (a retrained model always replaces the old one)
  max_drawdown_for_pruning: 1.0 # Max drawdown allowed before Optuna trial pruning; 1.0 = disabled
  session_filter:
    start: "00:00"
    end: "23:59"

# --- Logging ---
logging:
  level: INFO  # INFO | DEBUG
  to_file: false
  rotate: 10 MB
  retention: 7 days

# --- Monitoring / Safety ---
watchdog:
  enabled: true
  max_consecutive_losses: 5      # Stop trading if more than N losses in a row
  cooldown_hours: 1              # Pause trading for X hours if triggered

# --- Monitoring ---
monitoring:
  lookback_days: 30 # Period over which to calculate performance metrics
  monitor_state_file: "results/monitor_state.json" # File to save LivePerformanceMonitor state
  telegram_bot_token: "" # Your Telegram Bot Token
  telegram_chat_id: "" # Your Telegram Chat ID (can be negative for groups)

# --- Asymmetric Compounding ---
asymmetric_compounding:
  enabled: false  # off: 1% per trade is a hard ceiling (a win streak could double it)
  win_streak_multiplier: 1.2
  loss_streak_divisor: 0.8
  max_streak_effect: 2.0
  reset_on_opposite_outcome: true
  lookback_trades: 5

# --- Misc / Transparency ---
startup_logging: true             # log key settings at bot launch for transparency

# --- Symbol Specific Overrides ---
# Overrides any top-level setting for one symbol. Retraining times are staggered so symbols don't retrain at once.
symbol_overrides:
  "USDJPY#":
    atr_grid: [1.0, 1.5, 2.0, 2.5]
    min_prob_grid_long: [0.53, 0.55, 0.57, 0.60, 0.63]
    min_prob_grid_short: [0.53, 0.55, 0.57, 0.60, 0.63]
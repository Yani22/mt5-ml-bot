# config.yaml

# --- General Settings ---
use_gpu: false # Master switch to enable GPU acceleration for supported models (lgbm, xgb)
magic_number: 424242 # Unique ID for this bot's trades
data_source: mt5 # "mt5" or "csv". Automatically switches to csv on non-windows

# --- Optuna Tuning Specifics ---
optuna_n_trials: 100  # 150

# --- Backtesting Settings ---
backtesting:
  initial_equity: 8.75
  simulation_volume_min: 0.1 # NEW: Force backtester to use this minimum lot size
  enable_retraining: False # New field to control retraining in backtester.py

optuna_pruning_interval: 100 # New: Interval for Optuna pruning checks
n_jobs: -1 # Number of parallel jobs for tuning. -1 means all available CPU cores.
roc_lags_options:
- [1, 3, 5, 10]
- [1, 2, 4, 8]
- [2, 5, 10, 15]
- [1, 2, 3]

# --- ML & CV Settings ---
cv_samples_per_split: 1000 # Affects number of splits in TimeSeriesSplit. Higher -> fewer splits -> faster but less robust CV.

# --- Fetch / Data Management ---
fetch:
  initial_fetch_bars: 45000        # 30000 how many bars to bootstrap at startup / initial fetch
  save_raw_data_locally: true      # store raw CSV/feather parquet locally for caching
  raw_data_dir: "data/historical_data" # where to store cached data
  retrain_in_background: false      # whether retrain runs async
  retrain_time_utc: "23:55"           #null set to "23:55" if you want scheduled daily retrain, null = disabled
force_retrain_on_startup: false    # Set to true to force retraining of all models on bot startup (e.g., after feature changes).

# --- Ensemble Training Control ---
ensemble_training:
  min_samples_for_ensemble: 1000   # don’t fit ensemble if fewer samples available

# --- Symbols & timeframe ---
# historical_data symbols for .csv needed: M5-EURUSD#, H1-EURUSD#, and M5-USDX-DEC25
symbols: ["USDCADm#"]
# symbols: ["AUDUSDm#", "GBPUSDm#", "EURUSDm#"]
# symbols: ["USDJPYm#", "GBPJPYm#", "EURJPYm", "USDCADm", "EURGBPm"] 
timeframe: "M5"            # One of: M1, M5, M15, M30, H1, H4
history_bars: 3000          #22500 18000 36000 45000 #12000-for-tuner.py #5000-for-backtesting
retrain_every_bars: 1000     # ~3.5 days at M5
prediction_horizon: 12       # 6 Bars ahead for label (~30 min on M5)
retraining_window_bars: 45000         # Number of recent bars for rolling window retraining. null for expanding window.

# --- Features (now tunable) ---
features:
  rsi_period: [14, 14]
  ema_slow: [200, 200]

# --- Context Features (static, not tuned by optuna) ---
context_features:
  mta:
    enabled: true
    timeframe: "H1"   #M5 H1
    ema_period: 50    #600  50
    rsi_period: 14    #600  14
  inter_market:
    enabled: false
    symbol: "USDX-DEC25" # Make sure this symbol is available in your data source
    roc_lags: [5, 21, 63]
  price_action:
    enabled: true
    home_base_ma_period: 200  #1000 200
    swing_lookback: 50        #250  50

# --- Base learners / models ---
# For live bot: after tuning, Optuna best parameters overwrite these
# For tuning: these ranges are used by Optuna
models:
- name: lgbm
  params:
      # Tunable ranges for Optuna
    n_estimators: [100, 500]         # min, max
    learning_rate: [0.01, 0.1, "log"]
    max_depth: [3, 10]
    subsample: [0.6, 1.0]
    colsample_bytree: [0.6, 1.0]

ensemble:
  method: soft_vote
  threshold_metric: sharpe_ratio # custom_pnl # sharpe_ratio
  threshold_grid: auto # [0.5, 0.51, 0.52, 0.53, 0.54, 0.55, 0.56, 0.57, 0.58, 0.59, 0.6] # auto
  min_ensemble_auc: 0.55        # 0.55 Minimum AUC required to allow trading
  auto_threshold: true           # Auto-adjust thresholds based on historical PnL

# --- Trading costs & execution ---
trading_costs:
  source: static
  defaults:
    spread_pips: 1.5
    slippage_pips: 0.1
    commission_per_trade: 0.0
    lot_size: 0.1
    pip_value: 0.0001
    adaptive_slippage: true        # dynamically calculate slippage based on recent spread
    retry_order_send: 3            # number of retries for failed order sends

# --- Thompson Sampling Configuration ---
thompson_sampling:
  enabled: true
  atr_grid: [1.0, 1.5, 2.0, 2.5] # ATR multiplier - provides options for the stop-loss distance
  min_prob_grid_long: [0.53, 0.55, 0.57, 0.60, 0.63]
  min_prob_grid_short: [0.53, 0.55, 0.57, 0.60, 0.63]
  prior_mean: 0.0
  prior_var: 1.0
  obs_var: 1.0
  decay: 0.995 # Forgetting factor for non-stationarity
  reward_normalization_factor: 1000.0 # Divide PnL by this to normalize reward
  rule_rolling_window: 100 # Bars for rolling volatility/returns
  vol_threshold: 0.0005 # Example threshold for inverse_vol_scale
  dd_cut_multiplier: 2.0 # Multiplier for max_drawdown in scaling
  consec_loss_cut: 0.2 # Multiplier for consecutive losses in scaling
  contextual_enabled: true           # Toggle contextual bandit
  context_dim: 9                      # dim of context vector if contextual_enabled
  min_visits_for_exploration: 5        # number of visits before arm is considered "known"
  exploration_risk_mult: 0.5         # fraction of normal risk to use for exploratory arms
  warmstart_weight: 1.0              # weight for warmstart merging (1.0 = fully add backtest priors)
  state_file: "results/ts_risk_controller_state.json" # File to save RiskController state

  # Adaptive Grid Configuration (for Dynamic Grid Adaptation)
  adaptive_grids_enabled: false
  adaptation_interval_updates: 500   # Number of updates to an arm before considering adaptation
  adaptation_refinement_factor: 0.3  # How much to narrow the search space (e.g., 0.3 means 30% of current interval)
  min_grid_size: 5                   # Minimum number of arms in a grid
  max_grid_size: 20                  # Maximum number of arms in a grid

  # Bandit Reset Configuration
  bandit_reset_enabled: true
  reset_on_drawdown_percent: 0.20    # Reset if equity drops X% from peak
  reset_on_consecutive_losses: 10    # Reset if X consecutive losing trades
  reset_on_low_ensemble_auc: 0.52    # Reset if ensemble AUC drops below this
  reset_cooldown_hours: 24.0         # Cooldown period after a reset (in hours)

# --- Risk management ---
risk:
  risk_per_trade: 0.02
  dynamic_risk:
    enabled: true
    base_risk: 0.02      #0.02 Risk 2% of equity on the least confident trades 0.01
    max_risk: 0.035         #0.035 Risk up to 3% of equity on the most confident trades  0.015
    auc_floor: 0.55        # The AUC score that corresponds to base_risk
    auc_ceiling: 0.65      # The AUC score that corresponds to max_risk

  dynamic_tp:
    enabled: true
    base_tp_mult: 2.0     # For low-confidence trades, aim for a 2x ATR take-profit
    max_tp_mult: 4.0      # For high-confidence trades, give them more room to run with a 4x ATR take-profit
    auc_floor: 0.55        # Same AUC floor as risk
    auc_ceiling: 0.65      # Same AUC ceiling as risk

  max_positions: 1            # Max concurrent positions 1-backtest 3-main
  max_portfolio_risk: 0.15       #Total equity risk cap  0.05-backtest 0.15-main
  atr_multiplier_sl: 1.0
  atr_multiplier_tp: 2.0
  breakeven_at_1R: true
  trailing_atr_mult: 1.0
  min_prob_long: 0.55 #0.65-max #0.51-0.55|low #0.56-0.65|high
  min_prob_short: 0.55 #0.65-max #0.51-0.55|low #0.56-0.65|high
  block_on_drawdown: 1.0      # 0.20         # 0.1 pause if drawdown from equity peak exceeds 10%     #disable 1.0
  min_auc_improvement: 0.0025     # 0.005 default # minimum improvement in AUC to accept a new model
  max_drawdown_for_pruning: 1.0 # New: Max drawdown allowed before Optuna trial pruning  #disable 1.0
  session_filter:
    start: "00:00"
    end: "23:59"

# --- Logging ---
logging:
  level: INFO  #INFO #DEBUG
  to_file: false
  rotate: 10 MB
  retention: 7 days

# --- Monitoring / Safety ---
watchdog:
  enabled: false
  max_consecutive_losses: 5      # 5 Stop trading if more than N losses in a row
  cooldown_hours: 1              # 1 Pause trading for X hours if triggered

# --- Monitoring ---
monitoring:
  lookback_days: 30 # Period over which to calculate performance metrics
  monitor_state_file: "results/monitor_state.json" # File to save LivePerformanceMonitor state
  telegram_bot_token: "" # Your Telegram Bot Token
  telegram_chat_id: "" # Your Telegram Chat ID (can be negative for groups)

# --- Misc / Transparency ---
startup_logging: true             # log key settings at bot launch for transparency

# --- Symbol Specific Overrides ---
# Use this section to override settings for specific symbols, like pip_value for non-forex instruments.
symbol_overrides:
  "GBPUSDm#":
    retrain_time_utc: "01:02" #"23:55" Staggered retraining time  "01:00"
    # --- Thompson Sampling Grid Overrides ---
    atr_grid: [1.0, 1.5, 2.0, 2.5]
    min_prob_grid_long: [0.53, 0.55, 0.57, 0.60, 0.63]
    min_prob_grid_short: [0.53, 0.55, 0.57, 0.60, 0.63]
  "AUDUSDm#":
    retrain_time_utc: "01:12" #"23:55" Staggered retraining time  "01:15"
    # --- Thompson Sampling Grid Overrides ---
    atr_grid: [1.0, 1.5, 2.0, 2.5]
    min_prob_grid_long: [0.53, 0.55, 0.57, 0.60, 0.63]
    min_prob_grid_short: [0.53, 0.55, 0.57, 0.60, 0.63]
  "EURUSDm#": 
    retrain_time_utc: "01:22" #"23:55" Staggered retraining time  "01:30"
    # --- Thompson Sampling Grid Overrides ---
    atr_grid: [1.0, 1.5, 2.0, 2.5]
    min_prob_grid_long: [0.53, 0.55, 0.57, 0.60, 0.63]
    min_prob_grid_short: [0.53, 0.55, 0.57, 0.60, 0.63]
